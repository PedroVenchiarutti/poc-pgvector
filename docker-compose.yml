services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: poc-pgvector-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: poc
      POSTGRES_PASSWORD: poc
      POSTGRES_DB: poc
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./api/prisma/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U poc"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: poc-pgvector-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://poc:poc@postgres:5432/poc?schema=public
      PORT: 3333
      TRANSFORMERS_CACHE: /app/.cache/models
    ports:
      - "3333:3333"
    volumes:
      - ./api:/app
      - /app/node_modules
      - model-cache:/app/.cache/models
    command: sh -c "npx prisma db push --skip-generate && npm run dev"

volumes:
  pgdata:
  model-cache:
